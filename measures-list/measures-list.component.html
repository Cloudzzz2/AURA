<p-table #threatsList
         [value]="measuresData()"
         [paginator]="true"
         [rows]="10"
         [showCurrentPageReport]="true"
         [rowsPerPageOptions]="[5, 10]"
         [scrollable]="true"
         [globalFilterFields]="['name']"
         [sortMode]="'single'"
         (onPage)="pageChange($event)"
         scrollHeight="flex"
         selectionMode="single"
         currentPageReportTemplate="Отображены записи с {first} по {last}. Всего {totalRecords}.">
    <ng-template pTemplate="caption">
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText
                       [(ngModel)]="searchValue"
                       (input)="threatsList.filterGlobal(searchValue, 'startsWith')"
                       placeholder="Введите текст"
                       type="text"/>
            </span>
    </ng-template>
    <ng-template pTemplate="header">
        <tr>
            <th>№</th>
            <th pSortableColumn="name">
                <span>Угроза</span>
                <p-sortIcon field="name"/>
            </th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body"
                 let-threat
                 let-rowIndex="rowIndex">
        <tr>
            <td>{{ rowIndex + 1 }}</td>
            <td>{{ threat.name }}</td>
        </tr>
    </ng-template>
</p-table>
